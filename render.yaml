{
  "$schema": "https://json.schemastore.org/render.yaml",
  "services": [
    {
      "type": "web",
      "name": "creators-mela-api",
      "runtime": "node",
      "plan": "free",
      "buildCommand": "cd server && npm install",
      "startCommand": "cd server && node index.js",
      "envVars": [
        { "key": "NODE_ENV", "value": "production" },
        { "key": "PORT", "value": "5000" },
        { "key": "MONGODB_URI", "sync": false },
        { "key": "JWT_SECRET", "generateValue": true },
        { "key": "JWT_REFRESH_SECRET", "generateValue": true },
        { "key": "JWT_EXPIRES_IN", "value": "15m" },
        { "key": "JWT_REFRESH_EXPIRES_IN", "value": "7d" },
        { "key": "CORS_ORIGIN", "value": "https://creators-mela.vercel.app" }
      ],
      "healthCheckPath": "/api/v1/health"
    }
  ]
}
